name: abould_ada
description: Abould Application Development Accelerator — internal Flutter starter kit.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: any
  equatable: ^2.0.7
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^14.8.1
  image_picker: ^1.1.2
  connectivity_plus: ^6.1.4
  file_picker: ^8.3.7
  dio: ^5.8.0+1
  logger: ^2.5.0
  shared_preferences: ^2.5.3

  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.5
  firebase_crashlytics: ^4.3.5
  supabase_flutter: ^2.18.3
  flutter_image_compress: ^2.3.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - dart_defines/supabase.local.json
